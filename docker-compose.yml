# docker-compose.yml
# restart: always = Chaos Mode demo. Kill the container, watch it come back.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hackathon_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"  # <-- Add this line
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/hackathon_db
    depends_on:
      db:
        condition: service_healthy
    # Gold tier: restart: always means Docker resurrects the container
    # automatically if it crashes or is killed — this is your chaos demo.
    restart: always

volumes:
  pgdata: